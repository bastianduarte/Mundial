<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial en Vivo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05080f;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 10px 80px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .trophy { font-size: 22px; }

  .brand-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(220,38,38,0.15);
    border: 1px solid rgba(220,38,38,0.4);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #f87171;
    text-transform: uppercase;
  }

  .dot {
    width: 6px; height: 6px;
    background: #dc2626;
    border-radius: 50%;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:0.2; }
  }

  /* GRUPO / FASE */
  .phase-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #ffd700;
    text-transform: uppercase;
    margin: 20px 0 8px;
    padding-left: 2px;
    opacity: 0.7;
  }

  /* MATCH CARD */
  .match {
    background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 0;
    margin-bottom: 8px;
    overflow: hidden;
    position: relative;
    transition: border-color 0.3s;
  }

  .match.live {
    border-color: rgba(220,38,38,0.35);
    background: linear-gradient(135deg, rgba(220,38,38,0.06) 0%, rgba(10,8,20,0.8) 100%);
  }

  .match.live::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #dc2626, transparent);
    animation: scanline 2s ease-in-out infinite;
  }

  @keyframes scanline {
    0%,100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .match-inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 14px 16px;
    gap: 10px;
  }

  /* EQUIPO */
  .team { display: flex; flex-direction: column; }
  .team.home { align-items: flex-start; }
  .team.away { align-items: flex-end; }

  .team-flag { font-size: 28px; line-height: 1; margin-bottom: 4px; }

  .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #e8e8f0;
    line-height: 1;
  }

  .team-country {
    font-size: 10px;
    color: #3a3a55;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* MARCADOR CENTRAL */
  .score-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 90px;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .score-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    min-width: 28px;
    text-align: center;
  }

  .score-sep {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 400;
    color: #1e1e35;
    line-height: 1;
  }

  .match-status {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .s-live   { color: #f87171; background: rgba(220,38,38,0.15); }
  .s-ht     { color: #fbbf24; background: rgba(251,191,36,0.1); }
  .s-final  { color: #3a3a55; background: rgba(255,255,255,0.04); }
  .s-soon   { color: #6366f1; background: rgba(99,102,241,0.1); }

  .match-time {
    font-size: 10px;
    color: #3a3a55;
    margin-top: 2px;
  }

  /* FOOTER bar debajo de la card para info extra */
  .match-footer {
    border-top: 1px solid rgba(255,255,255,0.04);
    padding: 5px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .match-venue {
    font-size: 9px;
    color: #2a2a40;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .match-phase-tag {
    font-size: 9px;
    color: #2a2a40;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 60px 0;
    color: #2a2a3a;
  }

  .loader {
    width: 32px; height: 32px;
    border: 2px solid #0f0f1f;
    border-top-color: #ffd700;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 14px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* REFRESH BTN */
  .fab {
    position: fixed;
    bottom: 20px; right: 20px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    border: none;
    cursor: pointer;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 24px rgba(255,215,0,0.3);
    transition: transform 0.2s;
    z-index: 99;
  }
  .fab:hover { transform: scale(1.1); }
  .fab.spin { animation: spin 0.7s linear infinite; opacity: 0.6; pointer-events: none; }

  /* Timestamp */
  .timestamp {
    text-align: center;
    font-size: 10px;
    color: #1e1e30;
    letter-spacing: 1px;
    margin-top: 16px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand">
      <span class="trophy">🏆</span>
      <span class="brand-text">Mundial en Vivo</span>
    </div>
    <div class="live-pill">
      <div class="dot"></div>
      <span>Live</span>
    </div>
  </div>

  <div id="root">
    <div class="loading">
      <div class="loader"></div>
      <div class="loading-text">Cargando partidos...</div>
    </div>
  </div>

  <div class="timestamp" id="ts"></div>
</div>

<button class="fab" id="fab" onclick="load()" title="Actualizar">↻</button>

<script>
// Emojis de banderas por nombre de país (los más comunes del mundo)
const FLAGS = {
  "Argentina":"🇦🇷","Brasil":"🇧🇷","Francia":"🇫🇷","Alemania":"🇩🇪","España":"🇪🇸",
  "Portugal":"🇵🇹","Inglaterra":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Países Bajos":"🇳🇱","Italia":"🇮🇹","Bélgica":"🇧🇪",
  "Uruguay":"🇺🇾","Colombia":"🇨🇴","México":"🇲🇽","Estados Unidos":"🇺🇸","Japón":"🇯🇵",
  "Senegal":"🇸🇳","Marruecos":"🇲🇦","Ghana":"🇬🇭","Nigeria":"🇳🇬","Camerún":"🇨🇲",
  "Suiza":"🇨🇭","Croacia":"🇭🇷","Polonia":"🇵🇱","Dinamarca":"🇩🇰","Serbia":"🇷🇸",
  "Corea del Sur":"🇰🇷","Australia":"🇦🇺","Ecuador":"🇪🇨","Catar":"🇶🇦","Irán":"🇮🇷",
  "Arabia Saudita":"🇸🇦","Túnez":"🇹🇳","Canadá":"🇨🇦","Gales":"🏴󠁧󠁢󠁷󠁬󠁳󠁿","Costa Rica":"🇨🇷",
  "Suecia":"🇸🇪","Noruega":"🇳🇴","Hungría":"🇭🇺","Escocia":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Turquía":"🇹🇷",
  "Rep. Checa":"🇨🇿","Austria":"🇦🇹","Ucrania":"🇺🇦","Rumanía":"🇷🇴","Eslovaquia":"🇸🇰",
  "Albania":"🇦🇱","Georgia":"🇬🇪","Eslovenia":"🇸🇮","Grecia":"🇬🇷","Islandia":"🇮🇸",
  "Paraguay":"🇵🇾","Perú":"🇵🇪","Chile":"🇨🇱","Bolivia":"🇧🇴","Venezuela":"🇻🇪",
  "Panamá":"🇵🇦","Honduras":"🇭🇳","Jamaica":"🇯🇲","Trinidad y Tobago":"🇹🇹",
  "China":"🇨🇳","India":"🇮🇳","Indonesia":"🇮🇩","Vietnam":"🇻🇳","Tailandia":"🇹🇭",
  "Irak":"🇮🇶","Jordania":"🇯🇴","Emiratos Árabes":"🇦🇪","Omán":"🇴🇲",
  "Egipto":"🇪🇬","Algeria":"🇩🇿","Mali":"🇲🇱","Costa de Marfil":"🇨🇮","Benín":"🇧🇯",
  "Burkina Faso":"🇧🇫","Guinea":"🇬🇳","Mozambique":"🇲🇿","Angola":"🇦🇴",
  "Nueva Zelanda":"🇳🇿","Filipinas":"🇵🇭","Líbano":"🇱🇧","Siria":"🇸🇾",
  "Haiti":"🇭🇹","Cuba":"🇨🇺","Guatemala":"🇬🇹","El Salvador":"🇸🇻",
};

function flag(name) {
  if (!name) return "🏳️";
  for (const [k,v] of Object.entries(FLAGS)) {
    if (name.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(name.toLowerCase())) return v;
  }
  return "🏳️";
}

function statusInfo(s) {
  const v = (s||"").toLowerCase();
  if (v.includes("halftime")||v.includes("half_time")||v.includes("ht")) return {label:"Medio Tiempo", cls:"s-ht", live:true};
  if (v.includes("inprogress")||v.includes("in_progress")||v.includes("live")) return {label:"En Vivo", cls:"s-live", live:true};
  if (v.includes("closed")||v.includes("complete")||v.includes("final")||v.includes("ft")||v.includes("ended")||v.includes("finished")) return {label:"Final", cls:"s-final", live:false};
  return {label:"Hoy", cls:"s-soon", live:false};
}

function renderMatches(data) {
  const phases = data.phases || [{ name: "", matches: data.matches || data.games || [] }];
  let html = "";
  for (const phase of phases) {
    if (phase.name) html += `<div class="phase-label">${phase.name}</div>`;
    for (const m of (phase.matches || [])) {
      const hn = m.home?.name || m.home_team || "Local";
      const an = m.away?.name || m.away_team || "Visitante";
      const hs = m.home_goals ?? m.home_score ?? "–";
      const as_ = m.away_goals ?? m.away_score ?? "–";
      const { label, cls, live } = statusInfo(m.status);
      const min = m.minute ? `${m.minute}'` : "";
      const venue = m.venue || m.stadium || "";
      const phaseTag = m.phase || m.round || "";
      html += `
      <div class="match ${live?"live":""}">
        <div class="match-inner">
          <div class="team home">
            <div class="team-flag">${flag(hn)}</div>
            <div class="team-name">${hn}</div>
          </div>
          <div class="score-wrap">
            <div class="score-row">
              <span class="score-num">${hs}</span>
              <span class="score-sep">–</span>
              <span class="score-num">${as_}</span>
            </div>
            <span class="match-status ${cls}">${label}</span>
            ${min ? `<span class="match-time">${min}</span>` : ""}
          </div>
          <div class="team away">
            <div class="team-flag">${flag(an)}</div>
            <div class="team-name">${an}</div>
          </div>
        </div>
        ${(venue||phaseTag) ? `
        <div class="match-footer">
          <span class="match-venue">${venue}</span>
          <span class="match-phase-tag">${phaseTag}</span>
        </div>` : ""}
      </div>`;
    }
  }
  return html || `<div class="loading"><div class="loading-text">Sin partidos hoy</div></div>`;
}

async function load() {
  const fab = document.getElementById("fab");
  const root = document.getElementById("root");
  fab.classList.add("spin");
  root.innerHTML = `<div class="loading"><div class="loader"></div><div class="loading-text">Cargando partidos...</div></div>`;

  const prompt = `You are a football (soccer) world cup data assistant. Return ONLY a valid JSON object with no markdown, no explanation, no text outside JSON.

Structure:
{
  "phases": [
    {
      "name": "Fase de Grupos – Grupo A",
      "matches": [
        {
          "home": {"name": "Argentina"},
          "away": {"name": "Francia"},
          "home_goals": 2,
          "away_goals": 1,
          "status": "inprogress",
          "minute": 67,
          "venue": "Estadio Lusail",
          "phase": "Grupo A"
        }
      ]
    }
  ]
}

Generate realistic FIFA World Cup 2026 match data for today (June 15, 2026). Include:
- 2-3 phases/groups with 2-3 matches each
- Mix of: inprogress (with minutes 1-90), halftime, closed (final), scheduled
- Real World Cup team names and stadiums
- Use country names in Spanish
- Status values: "inprogress", "halftime", "closed", "scheduled"
Only return the JSON.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(text);
    root.innerHTML = renderMatches(parsed);
  } catch(e) {
    root.innerHTML = `<div class="loading"><div class="loading-text">Error cargando datos</div></div>`;
  }

  document.getElementById("ts").textContent = `Actualizado: ${new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}`;
  fab.classList.remove("spin");
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
